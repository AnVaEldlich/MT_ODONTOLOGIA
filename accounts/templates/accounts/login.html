{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentiPlus - Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="logo" onclick="window.location.href='{% url "home" %}'">       
            <h1>Denti<span>Plus</span></h1>
        </div>

        <div class="welcome-text">
            <h2>¡Bienvenido de nuevo!</h2>
            <p>Inicia sesión para continuar</p>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrapper">
                <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
        </div>

        <div class="checkbox-wrapper">
            <input type="checkbox" id="remember">
            <label for="remember">Recordarme</label>
        </div>

        <div class="forgot-password">
            <a href="#" onclick="alert('Funcionalidad de recuperación de contraseña'); return false;">¿Olvidaste tu contraseña?</a>
        </div>

        <button class="btn-login" onclick="handleLogin()">Iniciar Sesión</button>

        <div class="divider">
            <span>o</span>
        </div>

        <div class="register-link">
            ¿No tienes cuenta? <a href="{% url 'register' %}"> Regístrate aquí</a>
        </div>
    </div>

    <script src="{% static 'accounts/js/login.js' %}"></script>
</body>
</html>

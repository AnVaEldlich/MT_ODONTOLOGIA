{% for error in form.non_field_errors %}
<div class="alert error">{{ error }}</div>
{% endfor %}
{% for field in form %}
<div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}<div class="err">{{ error }}</div>{% endfor %}
</div>
{% endfor %}

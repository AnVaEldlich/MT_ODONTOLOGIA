{% for error in form.non_field_errors %}
<div class="alert error">{% include "core/includes/icon.html" with name="alerta" %}<span>{{ error }}</span></div>
{% endfor %}
{% for field in form %}
<div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="help-text">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<div class="err">{{ error }}</div>{% endfor %}
</div>
{% endfor %}

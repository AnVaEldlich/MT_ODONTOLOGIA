[pytest]
DJANGO_SETTINGS_MODULE = Web_odontologia.settings
python_files = tests.py test_*.py *_tests.py
testpaths = accounts/tests auditoria/tests citas/tests clinica/tests comunicacion/tests core/tests historia/tests perfiles/tests
addopts = -ra --tb=short
# pytest-env: settings.py exige SECRET_KEY, hosts y CSRF sin DEBUG. Las pruebas
# corren en modo desarrollo y en SQLite, sin tocar la base MySQL del .env local.
env =
    DEBUG=True
    USE_SQLITE=True
    SECRET_KEY=pytest-only-secret-key-not-for-production
